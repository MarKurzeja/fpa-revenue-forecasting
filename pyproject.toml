[project]
name = "fpa-revenue-forecasting"
version = "0.1.0"
description = "Rolling 13-week revenue forecasting, variance analysis and working capital for retail FP&A (Walmart M5)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
